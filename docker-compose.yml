# اجرای محلی برای توسعه:  cp .env.example .env && docker compose up --build
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-devroot}
      MYSQL_DATABASE: ${MYSQLDATABASE:-chatbot}
      MYSQL_USER: ${MYSQLUSER:-chatbot}
      MYSQL_PASSWORD: ${MYSQLPASSWORD:-chatbot}
    volumes:
      - dbdata:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./telegram_migration.sql:/docker-entrypoint-initdb.d/02_telegram.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-devroot}"]
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      MYSQLHOST: db
      MYSQLPORT: "3306"
    volumes:
      - .:/var/www/html   # تغییر کد بدون rebuild
    depends_on:
      db:
        condition: service_healthy
volumes:
  dbdata:
